<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Provincial Training Center - Davao Oriental Enrollment Monitoring System</title>

    <!-- FONT -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <!-- SHEET JS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --bg: #eef3fb;
            --card: #ffffff;
            --text: #0f172a;
            --sub: #64748b;
            --primary: #2563eb;
            --border: #dbe4f0;
            --shadow: 0 18px 45px rgba(15, 23, 42, 0.08);
            --surface: #f8fafc;
        }

        body.dark {
            --bg: #08101f;
            --card: #172033;
            --text: #f8fafc;
            --sub: #94a3b8;
            --primary: #3b82f6;
            --border: #334155;
            --shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            --surface: #111827;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 220px;
            height: 100vh;
            background: rgba(255,255,255,0.92);
            border-right: 1px solid rgba(37,99,235,0.15);
            backdrop-filter: blur(22px);
            padding: 18px 16px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: .3s ease;
            box-shadow: 0 24px 50px rgba(15,23,42,0.12);
            z-index: 1000;
        }
        
        .sidebar.compact {
            width: 60px;
            padding: 18px 10px;
        }
        
        .sidebar.compact .logo-text,
        .sidebar.compact .nav-label {
            display: none;
        }
        
        .sidebar.compact .logo {
            justify-content: center;
        }
        
        .sidebar.compact .nav-item {
            justify-content: center;
            padding: 10px;
        }
        
        .sidebar.compact .nav-icon {
            width: 36px;
            height: 36px;
            font-size: 18px;
        }

        body.dark .sidebar {
            background: rgba(15,23,42,0.92);
            border-right-color: rgba(255,255,255,0.12);
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(15,23,42,0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 20px;
            color: var(--primary);
        }

        .logo-text {
            font-size: 18px;
            font-weight: 800;
            color: var(--primary);
        }

        .sidebar-toggle {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text);
            padding: 4px;
            border-radius: 5px;
            transition: .2s ease;
        }

        .sidebar-toggle:hover {
            background: var(--surface);
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text);
            font-weight: 600;
            transition: .2s ease;
            background: transparent;
            border: 1px solid transparent;
        }

        .nav-item:hover {
            background: rgba(37,99,235,0.08);
            color: var(--primary);
            border-color: rgba(37,99,235,0.18);
        }

        .nav-item.active {
            background: rgba(37,99,235,0.16);
            color: var(--primary);
            border-color: rgba(37,99,235,0.2);
        }

        .nav-icon {
            display: grid;
            place-items: center;
            width: 28px;
            height: 28px;
            border-radius: 10px;
            font-size: 16px;
            background: rgba(37,99,235,0.1);
            color: var(--primary);
            transition: .2s ease;
        }

        .nav-item:hover .nav-icon,
        .nav-item.active .nav-icon {
            background: var(--primary);
            color: white;
        }

        .nav-label {
            font-size: 14px;
        }

        /* MAIN CONTENT */

body {
    min-height: 100vh;
    background: linear-gradient(180deg, #f5f8ff 0%, #eef3fb 100%);
    color: var(--text);
    transition: .3s ease;
    margin-left: 220px;
}

body.sidebar-compact {
    margin-left: 60px;
}

        body.dark {
            background: linear-gradient(180deg, #08101f 0%, #111827 100%);
        }

        .main-content {
            min-height: 100vh;
        }

        /* SIDEBAR MOBILE */

        @media(max-width:768px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            body {
                margin-left: 0;
            }
        }

        .container {
            width: min(95%, 1450px);
            margin: auto;
            padding: 30px 0 30px;
        }

        /* TOPBAR */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 16px 20px;
            box-shadow: var(--shadow);
        }

        body.dark .topbar {
            background: rgba(23, 32, 51, 0.75);
        }

        .title h1 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .title p {
            margin-top: 8px;
            color: var(--sub);
        }

        /* TOGGLE */

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .toggle {
            width: 80px;
            height: 38px;
            background: var(--card);
            border-radius: 999px;
            position: relative;
            cursor: pointer;
            border: 1px solid var(--border);
        }

        .toggle-circle {
            width: 30px;
            height: 30px;
            background: var(--primary);
            border-radius: 50%;
            position: absolute;
            top: 3px;
            left: 4px;
            transition: .3s ease;
        }

        body.dark .toggle-circle {
            left: 45px;
        }

        /* CARD */

        .card {
            background: var(--card);
            border-radius: 30px;
            padding: 16px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        .card.table-container {
            padding: 0;
        }

        /* UPLOAD */

        .upload-box {
            border: 2px dashed rgba(37, 99, 235, 0.3);
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background: rgba(37, 99, 235, 0.04);
            transition: .3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }

        .upload-box:hover {
            transform: translateY(-3px);
            background: rgba(37, 99, 235, 0.08);
        }

        .upload-icon {
            width: 90px;
            height: 90px;
            border-radius: 24px;
            margin: auto;
            display: grid;
            place-items: center;
            font-size: 42px;
            background: rgba(37, 99, 235, 0.12);
        }

        .upload-box h2 {
            margin-top: 20px;
            font-size: 32px;
        }

        .upload-box p {
            margin-top: 10px;
            color: var(--sub);
        }

        input[type=file] {
            display: none;
        }

        .btn {
            padding: 14px 32px;
            border-radius: 999px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: .3s ease;
            box-shadow: 0 15px 35px rgba(37, 99, 235, 0.18);
            align-self: center;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .bottom-actions {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .status-text {
            color: var(--sub);
            text-align: center;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .stat-card h3 {
            color: var(--sub);
            margin-bottom: 10px;
            font-size: 15px;
        }

        .stat-card h1 {
            font-size: 42px;
        }

        /* TABLE */

        .table-container {
            margin-top: 20px;
            overflow: auto;
            width: 100%;
            max-height: 55vh;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            box-shadow: var(--shadow);
            padding: 0;
        }

        table {
            width: max-content;
            min-width: 1400px;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: auto;
        }

        thead {
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            color: white;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 11;
            background: linear-gradient(135deg, var(--primary), #1d4ed8);
            background-clip: padding-box;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            vertical-align: top;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th {
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid rgba(255,255,255,0.15);
            white-space: nowrap;
            line-height: 1.4;
            background-color: transparent;
        }

        td {
            background: var(--card);
            color: var(--text);
            white-space: nowrap;
            max-width: 260px;
        }

        th:first-child {
            border-top-left-radius: 20px;
        }

        th:last-child {
            border-top-right-radius: 20px;
        }

        th:last-child {
            border-top-right-radius: 20px;
        }

        tbody tr {
            transition: all 0.2s ease;
            border-bottom: 1px solid var(--border);
        }

        tbody tr:hover {
            background: rgba(37, 99, 235, 0.08);
        }

        tbody tr:last-child {
            border-bottom: none;
        }

        tbody td:first-child {
            font-weight: 600;
            color: var(--primary);
        }

        /* SCROLLBAR STYLING */

        .table-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: var(--surface);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: var(--sub);
        }

        tbody tr {
            transition: .2s ease;
        }

        tbody tr:hover {
            background: rgba(37, 99, 235, 0.06);
        }

        .success {
            animation: pop .4s ease;
        }

        @keyframes pop {

            0% {
                transform: scale(.97);
            }

            100% {
                transform: scale(1);
            }
        }

        @media(max-width:768px) {

            .title h1 {
                font-size: 28px;
            }

            .card {
                padding: 20px;
            }

            .upload-box {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

                <i class="bi bi-grid-fill logo-icon"></i>

        <nav class="sidebar-nav">
            <a href="index.htm" class="nav-item active">

    <!-- MAIN CONTENT -->
    <main class="main-content">

    <div class="container">

        <!-- TOPBAR -->

        <div class="topbar">

                <p>Upload Excel files and save directly to Firebase Firestore</p>

                <thead></thead>

                <tbody></tbody>

    <!-- FIREBASE -->

    <script type="module">

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-analytics.js";

        import {
            getFirestore,
            doc,
            setDoc,
            serverTimestamp
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

        import {
            getAuth,
            signInAnonymously
        }
            from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

        // =========================
        // FIREBASE CONFIG
        // =========================

        const firebaseConfig = {

            apiKey: "AIzaSyA_5yrfn2aZpgj7IonuELDhUN9b_dpYRDE",

            authDomain: "ptcdo-enrollment.firebaseapp.com",

            projectId: "ptcdo-enrollment",

            storageBucket: "ptcdo-enrollment.firebasestorage.app",

            messagingSenderId: "516336813813",

            appId: "1:516336813813:web:d049e02d81bd0a62ad67bc",

            measurementId: "G-E02YC9SGTS"
        };

        // =========================
        // INITIALIZE FIREBASE
        // =========================

        const app = initializeApp(firebaseConfig);

        const analytics = getAnalytics(app);

        const db = getFirestore(app);

        const auth = getAuth(app);

        console.log("Firebase Initialized");

        // =========================
        // ELEMENTS
        // =========================

        const fileInput = document.getElementById("fileInput");

        const uploadButton = document.getElementById("uploadFirebaseBtn");
        const chooseFileBtn = document.getElementById("chooseFileBtn");
        const statusMessage = document.getElementById("statusMessage");

        let previewData = [];

        let firebaseReady = false;

        // =========================
        // AUTH
        // =========================

        signInAnonymously(auth)

            .then(() => {

                firebaseReady = true;

                statusMessage.textContent =
                    "Firebase Connected Successfully";

                console.log("Anonymous Auth Success");

            })

            .catch((error) => {

                console.error(error);

                statusMessage.textContent =
                    "Firebase Authentication Failed";
            });

        // =========================
        // SIDEBAR TOGGLE
        // =========================

        const sidebar = document.getElementById("sidebar");
        const sidebarToggle = document.getElementById("sidebarToggle");

        sidebarToggle.addEventListener("click", () => {
            sidebar.classList.toggle("open");
            sidebar.classList.toggle("compact");
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener("click", (e) => {
            if (window.innerWidth <= 768) {
                if (!sidebar.contains(e.target) && sidebar.classList.contains("open")) {
                    sidebar.classList.remove("open");
                    sidebar.classList.remove("compact");
                }
            }
        });

        // =========================
        // DARK MODE
        // =========================

        const toggle = document.getElementById("themeToggle");

        toggle.addEventListener("click", () => {

            document.body.classList.toggle("dark");

            localStorage.setItem(
                "theme",
                document.body.classList.contains("dark")
                    ? "dark"
                    : "light"
            );
        });

        if (localStorage.getItem("theme") === "dark") {

            document.body.classList.add("dark");
        }

        // =========================
        // LOADING
        // =========================

        function setLoading(isLoading, message = "") {

            if (isLoading) {

                uploadButton.disabled = true;

                uploadButton.innerHTML = "Uploading...";

            } else {

                uploadButton.disabled = false;

                uploadButton.innerHTML = "Upload to Firebase";
            }

            statusMessage.textContent = message;
        }

        // =========================
        // FILE IMPORT
        // =========================

        chooseFileBtn.addEventListener("click", () => {
            fileInput.click();
        });

        fileInput.addEventListener("change", (e) => {

            const file = e.target.files[0];

            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (event) {

                const file = e.target.files[0];
                const fileName = file ? file.name.toLowerCase() : '';

                // Stop if image file
                if (fileName.endsWith('.png') || fileName.endsWith('.jpg') ||
                    fileName.endsWith('.jpeg') || fileName.endsWith('.gif') ||
                    fileName.endsWith('.webp') || fileName.endsWith('.bmp')) {

                    alert("Image files are not supported. Please select an Excel file (.xlsx or .xls).");
                    fileInput.value = '';
                    statusMessage.textContent = "Waiting for Excel file...";
                    return;
                }

                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, {
                        type: 'array'
                    });

                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                let jsonData = XLSX.utils.sheet_to_json(
                    worksheet,
                    { header: 1 }
                );

                // Map field names using a mapping object (keys: lowercase, no spaces)
                const fieldMappings = {
                    'qualificationprogramtitle': 'Qualification',
                    'sex': 'Gender',
                    'municipalitycity': 'Municipality',
                    'province': 'Province',
                    'datestarted': 'Date_Started',
                    'date_started': 'Date_Started',
                    'datefinished': 'Date_Finished',
                    'date_finished': 'Date_Finished'
                };

                if (jsonData.length > 0 && jsonData[0]) {
                    const header = jsonData[0];
                    let normalizedHeader = header.map(h => {
                        const key = String(h || '').trim().toLowerCase().replace(/\s+/g, '');
                        return fieldMappings[key] || h;
                    });
                    jsonData[0] = normalizedHeader;
                }

                previewData = jsonData;
                renderTable(jsonData);

                const rowCount = document.querySelectorAll("#excelTable tbody tr").length;
                if (rowCount === 0) {
                    statusMessage.textContent = "No data rows found before processing markers";
                } else {
                    statusMessage.textContent = "Excel File Loaded Successfully";
                }

            } catch (error) {
                    console.error("Error parsing file:", error);
                    alert("Error reading file. Please ensure it's a valid Excel file.");
                    fileInput.value = '';
                    previewData = [];
                    statusMessage.textContent = "Waiting for Excel file...";
                }
            };

            reader.readAsArrayBuffer(file);
        });

        // =========================
        // FIREBASE SAVE
        // =========================

        uploadButton.addEventListener("click", async () => {

            if (!firebaseReady) {
                alert("Firebase not connected");
                return;
            }

            setLoading(true, "Processing data...");

            try {

                const stopKeywords = [
                    'still reading'
                ];

                const isStopRow = (row) => {
                    const rowText = row.map(c => String(c || '').toLowerCase().trim()).join(' ');
                    // Signature block marker: both "prepared by:" and "approved by:" in same row
                    if (rowText.includes('prepared by:') && rowText.includes('approved by:')) {
                        return true;
                    }
                    // "still reading" marker in any cell
                    return row.some(cell => {
                        const t = String(cell || '').toLowerCase().trim();
                        return stopKeywords.some(kw => t.includes(kw));
                    });
                };

                // Find first non-empty row as header
                let headers = null;
                let dataStartIdx = -1;
                for (let i = 0; i < previewData.length; i++) {
                    const row = previewData[i];
                    const hasContent = row.some(cell => {
                        const t = String(cell || '').trim();
                        return t !== '';
                    });
                    if (hasContent) {
                        // Normalize header using field mappings
                        const fieldMappings = {
                            'qualificationprogramtitle': 'Qualification',
                            'sex': 'Gender',
                            'municipalitycity': 'Municipality',
                            'province': 'Province',
                            'datestarted': 'Date_Started',
                            'date_started': 'Date_Started',
                            'datefinished': 'Date_Finished',
                            'date_finished': 'Date_Finished'
                        };
                        headers = row.map(h => {
                            const key = String(h || '').trim().toLowerCase().replace(/\s+/g, '');
                            return fieldMappings[key] || h;
                        });
                        dataStartIdx = i + 1;
                        break;
                    }
                }

                if (!headers) {
                    alert("No valid header row found");
                    setLoading(false, "No data to upload");
                    return;
                }

                let successCount = 0;
                let hasData = false;

                // Process rows until a stop row is encountered
                for (let i = dataStartIdx; i < previewData.length; i++) {
                    const row = previewData[i];

                    if (isStopRow(row)) {
                        console.log(`Stopped at row ${i}: stop marker reached - reading complete`);
                        break;
                    }

                    // Skip empty rows
                    const rowHasData = row.some(cell => {
                        const t = String(cell || '').trim();
                        return t !== '';
                    });
                    if (!rowHasData) continue;

                    hasData = true;

                    const traineeId = `trainee_${Date.now()}_${i}`;
                    const traineeData = {};

                    headers.forEach((header, index) => {
                        let field = String(header).trim();
                        // Normalize field name using mapping (case-insensitive, ignore spaces)
                        const key = field.toLowerCase().replace(/\s+/g, '');
                        const mapping = {
                            'qualificationprogramtitle': 'Qualification',
                            'sex': 'Gender',
                            'municipalitycity': 'Municipality',
                            'province': 'Province',
                            'datestarted': 'Date_Started',
                            'date_started': 'Date_Started',
                            'datefinished': 'Date_Finished',
                            'date_finished': 'Date_Finished'
                        };
                        field = mapping[key] || field;
                        // Replace spaces with underscores for field name
                        field = field.replace(/\s+/g, "_");
                        traineeData[field] = row[index] || "";
                    });

                    traineeData.createdAt = serverTimestamp();

                    await setDoc(
                        doc(db, "trainees", traineeId),
                        traineeData
                    );

                    successCount++;
                }

                if (!hasData) {
                    setLoading(false, "No data rows to upload (stopped at marker)");
                    return;
                }

                setLoading(
                    false,
                    `Upload Completed! ${successCount} record(s) saved.`
                );

                document
                    .querySelector(".table-container")
                    .classList.add("success");

                setTimeout(() => {
                    document
                        .querySelector(".table-container")
                        .classList.remove("success");
                }, 500);

            } catch (error) {
                console.error(error);
                setLoading(
                    false,
                    "Upload Failed: " + error.message
                );
            }
        });

        // =========================
        // TABLE RENDER
        // =========================

        function renderTable(data) {
            const thead = document.querySelector("#excelTable thead");
            const tbody = document.querySelector("#excelTable tbody");
            thead.innerHTML = "";
            tbody.innerHTML = "";

            if (!Array.isArray(data) || data.length === 0) {
                document.getElementById("rowCount").textContent = 0;
                document.getElementById("columnCount").textContent = 0;
                uploadButton.disabled = true;
                return;
            }

            const stopKeywords = ['still reading'];
            const isStopRow = (row) => {
                const rowText = row.map(c => String(c || '').toLowerCase().trim()).join(' ');
                if (rowText.includes('prepared by:') && rowText.includes('approved by:')) {
                    return true;
                }
                return row.some(cell => {
                    const t = String(cell || '').toLowerCase().trim();
                    return stopKeywords.some(kw => t.includes(kw));
                });
            };

            let headerRow = null;
            let headerIndex = -1;
            for (let i = 0; i < data.length; i++) {
                const row = data[i];
                if (!Array.isArray(row)) continue;
                const hasContent = row.some(cell => String(cell || '').trim() !== '');
                if (hasContent) {
                    headerRow = row.map(cell => {
                        const value = String(cell || '').trim();
                        const key = value.toLowerCase().replace(/\s+/g, '');
                        const fieldMappings = {
                            'qualificationprogramtitle': 'Qualification',
                            'sex': 'Gender',
                            'municipalitycity': 'Municipality',
                            'province': 'Province',
                            'datestarted': 'Date_Started',
                            'date_started': 'Date_Started',
                            'datefinished': 'Date_Finished',
                            'date_finished': 'Date_Finished'
                        };
                        return fieldMappings[key] || value || 'Column';
                    });
                    headerIndex = i;
                    break;
                }
            }

            if (!headerRow) {
                statusMessage.textContent = "Empty file - no data found";
                uploadButton.disabled = true;
                return;
            }

            const headerTr = document.createElement("tr");
            headerRow.forEach(header => {
                const th = document.createElement("th");
                th.textContent = header;
                headerTr.appendChild(th);
            });
            thead.appendChild(headerTr);

            let rowCount = 0;
            for (let i = headerIndex + 1; i < data.length; i++) {
                const row = data[i];
                if (!Array.isArray(row)) continue;
                if (isStopRow(row)) {
                    console.log(`Stopped rendering/reading at row ${i}: stop marker found`);
                    break;
                }
                const rowHasData = row.some(cell => String(cell || '').trim() !== '');
                if (!rowHasData) continue;

                const tr = document.createElement("tr");
                for (let j = 0; j < headerRow.length; j++) {
                    const td = document.createElement("td");
                    td.textContent = row[j] !== undefined ? row[j] : '';
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
                rowCount++;
            }

            document.getElementById("rowCount").textContent = rowCount;
            document.getElementById("columnCount").textContent = headerRow.length;
            uploadButton.disabled = rowCount === 0;
        }



    </script>
